services:
  mongodb:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  neo4j:
    image: neo4j:5
    environment: [NEO4J_AUTH=neo4j/glasmed]
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
  redis:
    image: redis:7-alpine
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  session-manager: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.session_manager.main:app --host 0.0.0.0 --port 8000}
  inference-server: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.inference_server.main:app --host 0.0.0.0 --port 8000}
  tool-collector: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.tool_collector.main:app --host 0.0.0.0 --port 8000}
  medical-data-layer: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.data_layer.main:app --host 0.0.0.0 --port 8000, ports: ["8001:8000"]}
  agent1-worker: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.agent1_worker.main:app --host 0.0.0.0 --port 8000}
  graph-generator: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.graph_generator.main:app --host 0.0.0.0 --port 8000}
  graph-collector: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.graph_collector.main:app --host 0.0.0.0 --port 8000}
  mas-orchestrator: {build: {context: ., dockerfile: Dockerfile.services}, command: uvicorn services.mas_orchestrator.main:app --host 0.0.0.0 --port 8000, ports: ["8002:8000"]}
  frontend:
    image: nginx:alpine
    volumes: [./frontend:/usr/share/nginx/html:ro]
    ports: ["8080:80"]
volumes: {mongo-data: {}, neo4j-data: {}}
