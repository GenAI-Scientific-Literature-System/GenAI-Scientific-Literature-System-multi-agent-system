    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: glas-med:latest
          command: ["python3", "api/server.py"]
          envFrom:
            - configMapRef:
                name: glas-med-config
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
