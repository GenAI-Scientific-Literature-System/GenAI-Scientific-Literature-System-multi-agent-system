apiVersion: v1
kind: Namespace
metadata:
  name: glas-med
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glas-med-config
  namespace: glas-med
data:
  MONGO_URI: "mongodb://mongodb.glas-med.svc.cluster.local:27017"
  NEO4J_URI: "bolt://neo4j.glas-med.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "glasmedpassword"
  REDIS_URL: "redis://redis.glas-med.svc.cluster.local:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.glas-med.svc.cluster.local:9092"
---
# ── INFRASTRUCTURE: MONGODB ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: glas-med
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: glas-med
spec:
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
# ── INFRASTRUCTURE: REDIS ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: glas-med
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: glas-med
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# ── INFRASTRUCTURE: NEO4J ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: glas-med
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.20-community
          env:
            - name: NEO4J_AUTH
              value: "neo4j/glasmedpassword"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: glas-med
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
# ── INFRASTRUCTURE: ZOOKEEPER & KAFKA ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: glas-med
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          ports:
            - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: glas-med
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: glas-med
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper.glas-med.svc.cluster.local:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.glas-med.svc.cluster.local:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: glas-med
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
---
# ── 1. MEDICAL DATA LAYER MICROSERVICE ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-data-layer
  namespace: glas-med
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medical-data-layer
  template:
    metadata:
      labels:
        app: medical-data-layer
    spec:
      containers:
        - name: data-layer
          image: glas-med:latest
          command: ["uvicorn", "services.data_layer.main:app", "--host", "0.0.0.0", "--port", "8001"]
          envFrom:
            - configMapRef:
                name: glas-med-config
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medical-data-layer
  namespace: glas-med
spec:
  selector:
    app: medical-data-layer
  ports:
    - port: 8001
      targetPort: 8001
---
